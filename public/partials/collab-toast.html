<!-- Live-Region bleibt dauerhaft im DOM (Begründung: job-toast.html). -->
<div class="toast-live" role="status" aria-live="polite">
  <template x-if="$store.collab.collabToast">
    <div class="job-toast job-toast--ok job-toast--collab"
         x-cloak>
      <span class="job-toast-msg" x-text="collabToastText()"></span>
      <button type="button"
              class="job-toast-close"
              :aria-label="t('common.close')"
              @click="_dismissCollabToast()"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </div>
  </template>
</div>
