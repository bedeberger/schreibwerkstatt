<!-- Nachtraegliche Verknuepfung Werkstatt-Figur → Katalog-Figur
     (`draft_figures.source_figure_id`). Baugleich mit dem Import-Picker
     nebenan: Ladezustand / Leer-Hinweis / Combobox / Bestaetigen-Zeile.

     Why: wer erst plant und dann schreibt, hat die Figur danach zweimal — in
     der Werkstatt (vorwaerts entwickelt) und im Katalog (rueckwaerts aus dem
     Text extrahiert). Ohne den Zeiger bleiben es zwei Figuren, und jede
     Bruecke im Haus fuehrt zwei Spalten. Bestaetigt wird von Hand: ein
     automatisch gesetzter Zeiger waere eine Behauptung ueber zwei Figuren,
     die nur der Autor treffen kann (Namensgleichheit ist bloss vorausgewaehlt). -->
<p class="card-hint" x-text="$app.t('werkstatt.link.hint')"></p>
<div x-show="linkCandidatesLoading" class="card-status" x-text="$app.t('common.loading')"></div>
<div x-show="!linkCandidatesLoading && linkCandidates.length === 0" class="card-status"
     x-text="$app.t('werkstatt.link.none')"></div>
<div x-show="!linkCandidatesLoading && linkCandidates.length > 0" class="form-stack">
  <div x-data="entityPicker({ entity: 'custom', placeholder: $app.t('werkstatt.link.pick'), items: () => linkCandidates.map(f => ({ value: String(f.id), label: f.name + (f.typ ? ' [' + f.typ + ']' : ''), sublabel: f.kurzname && f.kurzname !== f.name ? f.kurzname : '' })) })"
       x-modelable="value" x-model="selectedLinkFigureId"></div>
</div>
<div class="werkstatt-create-row">
  <button type="button" class="primary" :disabled="busy || !selectedLinkFigureId"
          @click="runLinkFigure()" x-text="$app.t('werkstatt.link.confirm')"></button>
  <button type="button" :disabled="busy" @click="cancelLinkFigure()" x-text="$app.t('common.cancel')"></button>
</div>
