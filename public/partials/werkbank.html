<!-- Werkbank — die Ansicht, die Figuren-, Plot- und Motiv-Werkstatt zusammen
     liest. Zwei Sichten, ein Bestand (siehe routes/werkbank.js). Rein lesend:
     bearbeitet wird in der jeweiligen Werkstatt, von hier fuehrt nur der Sprung
     zurueck. -->
<div class="card card--werkbank" x-data="werkbankCard" x-show="$app.showWerkbankCard" x-cloak>
  <div class="card-header">
    <h2 x-text="$app.t('tile.werkbank')"></h2>
    <div class="tabs" role="tablist" :aria-label="$app.t('tile.werkbank')">
      <button type="button" class="tabs-btn" role="tab"
              :class="{ 'tabs-btn--active': werkbankView === 'matrix' }"
              :aria-selected="werkbankView === 'matrix'"
              @click="setWerkbankView('matrix')" x-text="$app.t('werkbank.view.matrix')"></button>
      <button type="button" class="tabs-btn" role="tab"
              :class="{ 'tabs-btn--active': werkbankView === 'befunde' }"
              :aria-selected="werkbankView === 'befunde'"
              @click="setWerkbankView('befunde')" x-text="$app.t('werkbank.view.befunde')"></button>
    </div>
  </div>

  <div x-show="werkbankError" class="card-status card-status--error" x-text="werkbankError"></div>
  <div x-show="werkbankLoading" class="card-status" x-text="$app.t('common.loading')"></div>

  <!-- ── Matrix: Figuren × Akte ────────────────────────────────────────────── -->
  <template x-if="werkbankView === 'matrix' && werkbank">
    <div class="card-section">
      <p class="card-hint" x-text="$app.t('werkbank.matrix.hint')"></p>

      <div class="filter-bar" x-show="(werkbank.figuren || []).length > 3">
        <span class="filter-search-wrap">
          <input type="text" class="filter-search-input" x-model.debounce.200ms="werkbankFilter"
                 :placeholder="$app.t('werkbank.filter.figur')"
                 :aria-label="$app.t('werkbank.filter.figur')">
          <button type="button" class="search-clear--icon" x-show="werkbankFilter"
                  @click="werkbankFilter = ''"
                  :aria-label="$app.t('search.clear')" :data-tip="$app.t('search.clear')">
            <svg class="icon" aria-hidden="true"><use href="/icons.svg?v=693#x"/></svg>
          </button>
        </span>
      </div>

      <p class="muted-msg muted-msg--spaced"
         x-show="werkbankAkte().length === 0 || werkbankFiguren().length === 0"
         x-text="$app.t('werkbank.matrix.empty')"></p>

      <div class="werkbank-scroll" x-show="werkbankAkte().length > 0 && werkbankFiguren().length > 0">
        <table class="werkbank-table">
          <thead>
            <tr>
              <th class="werkbank-rowhead" x-text="$app.t('werkbank.col.figur')"></th>
              <template x-for="a in werkbankAkte()" :key="a.id">
                <th :data-tip="a.name"><span x-text="a.name"></span></th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="row in werkbankFiguren()" :key="row.key">
              <tr>
                <th class="werkbank-rowhead" scope="row">
                  <span class="werkbank-figur internal-link" @click="werkbankOpenFigur(row)"
                        :data-tip="$app.t('werkbank.openFigur')">
                    <span x-text="row.name"></span>
                    <span class="badge badge-neutral" x-show="row.kind === 'draft'"
                          x-text="$app.t('werkbank.kind.draft')"></span>
                  </span>
                  <!-- Bogen-Kurzform: wie viele geplante Kerne im Text belegt
                       sind. Ohne Verankerungslauf steht hier nichts — ungemessen
                       ist ungeprueft, nicht null. -->
                  <span class="werkbank-bogen" x-show="werkbankBogen(row)" x-cloak
                        x-text="werkbankBogen(row) ? $app.t('werkbank.bogen', werkbankBogen(row)) : ''"
                        :data-tip="$app.t('werkbank.bogen.tip')"></span>
                  <!-- Motive dieser Figur (Soll aus der Motiv-Werkstatt). -->
                  <span class="werkbank-motive" x-show="row.motive.length">
                    <template x-for="mo in row.motive" :key="'m' + mo.id">
                      <span class="tag tag--motif internal-link"
                            @click="werkbankOpenMotiv(mo)"
                            :data-tip="$app.t('werkbank.motiv.tip', { n: mo.ist })"
                            x-text="mo.name"></span>
                    </template>
                  </span>
                </th>
                <template x-for="a in werkbankAkte()" :key="a.id">
                  <!-- Eine LEERE Zelle ist die eigentliche Auskunft: diese Figur
                       kommt in diesem Akt nicht vor. Darum gezeichnet, nicht
                       weggelassen. -->
                  <td class="werkbank-cell" :class="{ 'werkbank-cell--empty': werkbankZelleLeer(row, a.id) }">
                    <template x-for="b in werkbankZelle(row, a.id)" :key="b.id">
                      <button type="button" class="werkbank-beat"
                              :class="'werkbank-beat--' + b.status"
                              @click="werkbankOpenBeat(b)"
                              :data-tip="b.titel + (b.zeit ? ' · ' + b.zeit : '')">
                        <span x-text="b.titel"></span>
                      </button>
                    </template>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- ── Befunde: die gemessenen Aussagen aller drei Werkstaetten ──────────── -->
  <template x-if="werkbankView === 'befunde'">
    <div class="card-section">
      <!-- Keine `Gemessen`-Plakette wie in der Figuren-Werkstatt: dort steht sie
           neben einer Ueberschrift und grenzt die Messbefunde vom KI-Urteil
           derselben Karte ab. Hier ist ALLES gemessen, das sagt der Hinweis
           selbst — die Plakette haette nichts, wovon sie unterscheidet. -->
      <div class="card-section-head card-section-head--baseline">
        <p class="card-hint" x-text="$app.t('werkbank.befunde.hint')"></p>
      </div>

      <div x-show="werkbankBefundeLoading" class="card-status" x-text="$app.t('common.loading')"></div>

      <!-- UNGEMESSEN IST UNGEPRUEFT, NICHT IN ORDNUNG. -->
      <p class="card-hint card-hint--warn" x-show="werkbankUngemessen().length" x-cloak
         x-text="$app.t('werkbank.befunde.ungemessen', {
           wo: werkbankUngemessen().map(k => $app.t('werkbank.werkstatt.' + k)).join(', ')
         })"></p>

      <div class="card-status" x-show="werkbankBefunde && !werkbankBefundeLoading && werkbankBefundListe().length === 0"
           x-text="$app.t('werkbank.befunde.none')"></div>

      <div class="entity-list entity-list--accented" x-show="werkbankBefundListe().length > 0">
        <template x-for="(b, idx) in werkbankBefundListe()" :key="b.werkstatt + ':' + b.code + ':' + idx">
          <div class="entity-row internal-link" @click="werkbankBefundOpen(b)"
               :data-tip="$app.t('werkbank.befunde.open')">
            <span class="severity-tag" :class="'severity-tag--' + b.schwere"
                  x-text="$app.t('werkstatt.severity.' + b.schwere)"></span>
            <span class="badge badge-neutral" x-text="$app.t('werkbank.werkstatt.' + b.werkstatt)"></span>
            <span class="entity-row-title" x-text="werkbankBefundZiel(b)"></span>
            <span class="entity-row-meta" x-text="werkbankBefundText(b)"></span>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
