<!-- Quelle aus PDF: Datei-Input + Laufanzeige des Jobs `source-pdf-draft`.
     Fragment von partials/sources.html (via `<!-- @include sources-pdf-draft -->`),
     kein eigener x-data-Scope — Methoden in public/js/sources/pdf-draft.js,
     gespreadet in `sourcesCard`. Das Ergebnis erscheint als Entwurf im
     Anlage-Formular (partials/sources-form.html). -->
  <input type="file" hidden accept="application/pdf" x-ref="srcPdfInput"
         :aria-label="$app.t('sources.pdfDraft.open')" @change="startSourceFromPdf($event)">
  <div class="sources-pdf-draft" x-show="srcPdfBusy || srcPdfError" x-cloak>
    <div class="progress-bar-wrap" x-show="srcPdfBusy">
      <div class="progress-bar" :style="{ '--progress': srcPdfProgress + '%' }"></div>
      <span class="muted-msg muted-msg--sm" x-text="srcPdfStatus"></span>
    </div>
    <p class="card-form-error" x-show="srcPdfError" x-text="srcPdfError"></p>
  </div>
