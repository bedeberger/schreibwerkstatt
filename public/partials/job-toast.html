<!-- Live-Region bleibt dauerhaft im DOM: ein role="status", der erst mit dem
     Toast selbst eingefügt wird, kündigen Screenreader nicht zuverlässig an. -->
<div class="toast-live" role="status" aria-live="polite">
  <template x-if="$store.jobs.jobToast">
    <div class="job-toast"
         :class="'job-toast--' + ($store.jobs.jobToast.severity || 'ok')"
         x-cloak>
      <span class="job-toast-msg" x-text="$store.jobs.jobToast.message"></span>
      <button type="button"
              class="job-toast-close"
              :aria-label="t('common.close')"
              @click="_dismissJobToast()"><svg class="icon" aria-hidden="true"><use href="/icons.svg#x"/></svg></button>
    </div>
  </template>
</div>
